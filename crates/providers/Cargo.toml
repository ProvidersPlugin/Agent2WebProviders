[package]
name = "agent2api-web-providers"
description = "Agent2API 网页提供商插件"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "agent2api-web-providers"
path = "src/main.rs"

[features]
default = ["all"]
all = ["chatglm", "deepseek", "tabbit"]
chatglm = []
deepseek = []
tabbit = []

[dependencies]
agent2api-provider-protocol = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
agent2api-provider-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "multipart"] }
url = "2"
base64 = "0.22"
md-5 = "0.10"
# Tabbit 的请求签名：HMAC-SHA256(signKey, "{ts}.{uuid}.{sha256(body)}")
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# safeStorage 解密在 Windows 上用 DPAPI + AES-GCM；JWT 解析（Tabbit）走同一模块，
# 因此 AES 不能只在 Windows 目标下编译 —— 非 Windows 也要能构建（CI 三平台）。
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "0.61", features = ["Win32_Security_Cryptography"] }
