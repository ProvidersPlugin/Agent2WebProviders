[package]
name = "agent2api-web-providers"
description = "Agent2API 网页提供商插件"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "agent2api-web-providers"
path = "src/main.rs"

[features]
default = ["all"]
all = ["chatglm", "deepseek"]
chatglm = []
deepseek = []

[dependencies]
agent2api-provider-protocol = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.3.0-beta.5.1" }
agent2api-provider-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.3.0-beta.5.1" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
base64 = "0.22"
md-5 = "0.10"
getrandom = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "0.61", features = ["Win32_Security_Cryptography"] }
